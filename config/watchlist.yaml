# Watchlist. Edit freely - `fi-agent watchlist add/remove` also maintains this file.
#
#   symbol            required, the ticker
#   name              company name, used to build news queries
#   sector_etf        optional, compared against to separate sector moves from company moves
#   move_threshold_pct  optional per-ticker override of screening.move_threshold_pct
#                       (raise it for high-beta names that move 3% on a quiet day)

tickers:
  - symbol: NVDA
    name: NVIDIA
    sector_etf: SMH
    move_threshold_pct: 2.0
  - symbol: SPCX
    name: SPACEX
    move_threshold_pct: 3.5
  - symbol: MSFT
    name: Microsoft
    move_threshold_pct: 1.7
  - symbol: AFRM
    name: Affirm Holdings
    move_threshold_pct: 6.5
  - symbol: AMZN
    name: Amazon
    move_threshold_pct: 5.0
  - symbol: BE
    name: Bloom Energy
    move_threshold_pct: 15.0
  - symbol: TSLA
    name: Tesla
    move_threshold_pct: 5.0
  - symbol: VST
    name: Vistra
    move_threshold_pct: 8.0
  - symbol: PLTR
    name: Palantir Technologies 
    move_threshold_pct: 5.0
  - symbol: XYZ
    name: Block
    move_threshold_pct: 5.0
  - symbol: QQC.TO
    name: CI Invesco NASDAQ 100
